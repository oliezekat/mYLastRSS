name: Pre-Test
description: PHP 8.2, Composer, PHPUnit (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.2']

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, iconv
        ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
        tools: composer

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader

    - name: Run PHPUnit tests (offline) suite
      run: composer run-script test-offline
